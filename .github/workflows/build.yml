name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --org com.helpme --project-name help_me .
      - name: Apply native overlay
        run: |
          rm -f test/widget_test.dart
          cp android_overlay/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp android_overlay/kotlin/*.kt android/app/src/main/kotlin/com/helpme/help_me/
          mkdir -p android/app/src/main/res/xml
          cp android_overlay/res/xml/*.xml android/app/src/main/res/xml/
          cp android_overlay/res/values/*.xml android/app/src/main/res/values/
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: HelpMe-apk
          path: build/app/outputs/flutter-apk/app-release.apk
