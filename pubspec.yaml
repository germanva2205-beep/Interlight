name: help_me
description: Help Me (H&M) - голосовой помощник
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  speech_to_text: ^7.0.0
  shared_preferences: ^2.2.3
  android_intent_plus: ^5.0.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png

flutter:
  uses-material-design: true
